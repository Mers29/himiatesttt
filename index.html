<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        /* Базовые стили и сброс */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #334e68;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Шапка */
        header {
            background-color: #102a43;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-wrap: nowrap;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.3s;
            flex: 0 0 auto;
        }

        .menu-btn:hover { color: #486581; }

        .header-title {
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            flex: 0 0 auto;
        }

        .top-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
            flex: 1 1 auto;
            min-width: 0;
            padding-bottom: 2px;
            cursor: grab;
            user-select: none;
            touch-action: pan-x;
        }

        .top-nav.dragging {
            cursor: grabbing;
        }

        .top-nav::-webkit-scrollbar {
            height: 6px;
        }

        .top-nav::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 999px;
        }

        .top-nav button {
            background: #243b53;
            color: #bcccdc;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex: 0 0 auto;
        }

        .top-nav button:hover,
        .top-nav button.active {
            background: #3e8ed0;
            color: white;
        }

        /* Боковое меню */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            max-width: 88vw;
            height: 100%;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 200;
            display: flex;
            flex-direction: column;
        }

        .sidebar.open { left: 0; }

        .sidebar-header {
            background: #102a43;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar-menu {
            padding: 10px 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .sidebar-menu button {
            width: 100%;
            text-align: left;
            padding: 15px 20px;
            background: none;
            border: none;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            font-size: 1rem;
            color: #334e68;
            transition: background 0.2s;
        }

        .sidebar-menu button:hover,
        .sidebar-menu button.active {
            background: #f0f4f8;
            color: #3e8ed0;
            font-weight: 600;
        }

        .reset-container {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #d64545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .reset-btn:hover { background: #ba2525; }

        /* Оверлей */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 150;
            display: none;
        }

        .overlay.open { display: block; }

        /* Основной контент */
        main {
            max-width: 800px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: #102a43;
            border-bottom: 2px solid #3e8ed0;
            padding-bottom: 10px;
            word-break: break-word;
        }

        /* Карточка вопроса */
        .question-card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .q-number {
            font-weight: bold;
            color: #3e8ed0;
            margin-right: 5px;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            transition: all 0.2s;
            cursor: pointer;
        }

        .option-item:hover:not(.disabled) {
            background-color: #f8fafc;
        }

        .option-item input {
            margin-right: 15px;
            transform: scale(1.2);
            cursor: pointer;
            flex: 0 0 auto;
        }

        .option-item label {
            flex-grow: 1;
            cursor: pointer;
            word-break: break-word;
        }

        /* Состояния */
        .disabled {
            pointer-events: none;
            opacity: 0.8;
        }

        .correct-answer {
            background-color: #d1fae5;
            border-color: #34d399;
        }

        .wrong-answer {
            background-color: #fee2e2;
            border-color: #f87171;
        }

        .missed-answer {
            background-color: #fef3c7;
            border-color: #fbbf24;
        }

        .submit-multi-btn {
            margin-top: 15px;
            background: #3e8ed0;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
        }

        .submit-multi-btn:hover { background: #2c7a7b; }

        .submit-multi-btn:disabled {
            background: #9fb3c8;
            cursor: not-allowed;
        }

        /* Итоги */
        .results-block {
            background: #102a43;
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
        }

        .results-block h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #4ade80;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            header {
                padding: 10px 12px;
                gap: 10px;
            }

            .header-title {
                font-size: 1rem;
            }

            .top-nav button {
                padding: 7px 12px;
                font-size: 0.95rem;
            }

            main {
                margin: 18px auto;
                padding: 0 12px;
            }

            .section-title {
                font-size: 1.4rem;
            }

            .question-card {
                padding: 18px;
            }

            .question-text {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            header {
                gap: 8px;
            }

            .menu-btn {
                font-size: 26px;
            }

            .header-title {
                display: none;
            }

            .top-nav {
                gap: 8px;
            }

            .top-nav button {
                padding: 7px 10px;
                font-size: 0.9rem;
            }

            .sidebar {
                width: 88vw;
            }

            .question-card {
                padding: 15px;
            }

            .option-item {
                padding: 9px 12px;
            }
        }
    </style>
</head>

        let currentSection = "";
        let progress = JSON.parse(localStorage.getItem('chemProgress')) || {};

        function init() {
            renderNav();

            const sections = Object.keys(quizData);
            if (sections.length > 0) {
                loadSection(sections[0]);
            } else {
                document.getElementById('section-title').textContent = "Добавьте вопросы в quizData";
                document.getElementById('questions-container').innerHTML = "";
                document.getElementById('results-container').innerHTML = "";
            }

            enableTopNavMouseDrag();
        }

        function renderNav() {
            const topNav = document.getElementById('top-nav');
            const sidebarMenu = document.getElementById('sidebar-menu');
            topNav.innerHTML = '';
            sidebarMenu.innerHTML = '';

            Object.keys(quizData).forEach(section => {
                const btnTop = document.createElement('button');
                btnTop.textContent = section;
                btnTop.onclick = () => loadSection(section);
                topNav.appendChild(btnTop);

                const btnSide = document.createElement('button');
                btnSide.textContent = section;
                btnSide.onclick = () => {
                    loadSection(section);
                    toggleSidebar();
                };
                sidebarMenu.appendChild(btnSide);
            });
        }

        function loadSection(section) {
            if (!quizData[section]) return;

            currentSection = section;
            document.getElementById('section-title').textContent = section;

            document.querySelectorAll('.top-nav button, .sidebar-menu button').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === section) btn.classList.add('active');
            });

            const container = document.getElementById('questions-container');
            container.innerHTML = '';

            if (!progress[section]) progress[section] = {};

            quizData[section].forEach((q, index) => {
                const optionCount = Object.keys(q.options).length;
                const isMulti = optionCount > 5; // A-E = одиночный, A-F и дальше = множественный
                const answeredData = progress[section][q.id];
                const isAnswered = !!answeredData;

                const card = document.createElement('div');
                card.className = 'question-card';

                let html = `<div class="question-text"><span class="q-number">${index + 1}.</span> ${q.text}</div>`;
                html += `<div class="options-list" id="opts-${q.id}">`;

                for (const [key, val] of Object.entries(q.options)) {
                    const inputType = isMulti ? 'checkbox' : 'radio';
                    const name = `q_${q.id}`;
                    const id = `q_${q.id}_${key}`;

                    let itemClass = 'option-item';
                    let checkedStr = '';

                    if (isAnswered) {
                        itemClass += ' disabled';
                        if (answeredData.selected.includes(key)) checkedStr = 'checked';

                        if (q.correct.includes(key) && answeredData.selected.includes(key)) {
                            itemClass += ' correct-answer';
                        } else if (!q.correct.includes(key) && answeredData.selected.includes(key)) {
                            itemClass += ' wrong-answer';
                        } else if (q.correct.includes(key) && !answeredData.selected.includes(key)) {
                            itemClass += ' missed-answer';
                        }
                    }

                    html += `
                        <div class="${itemClass}" id="wrap_${id}">
                            <input type="${inputType}" name="${name}" id="${id}" value="${key}" ${checkedStr}
                                ${isAnswered ? 'disabled' : ''}
                                ${!isMulti && !isAnswered ? `onchange="checkSingle(${q.id}, '${key}')"` : ''}>
                            <label for="${id}"><b>${key})</b> ${val}</label>
                        </div>
                    `;
                }

                html += `</div>`;

                if (isMulti) {
                    html += `<button class="submit-multi-btn" id="btn_${q.id}" onclick="checkMulti(${q.id})" ${isAnswered ? 'disabled style="display:none;"' : ''}>Ответить</button>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });

            updateResultsPanel();
        }

        function checkSingle(qId, selectedKey) {
            const q = quizData[currentSection].find(item => item.id === qId);
            if (!q) return;

            const isCorrect = q.correct.includes(selectedKey);

            progress[currentSection][qId] = {
                correct: isCorrect,
                selected: [selectedKey]
            };
            saveProgress();

            const inputs = document.getElementsByName(`q_${qId}`);
            inputs.forEach(input => {
                input.disabled = true;
                const wrapper = document.getElementById(`wrap_${input.id}`);
                wrapper.classList.add('disabled');

                if (input.value === q.correct[0]) {
                    wrapper.classList.add('correct-answer');
                } else if (input.value === selectedKey) {
                    wrapper.classList.add('wrong-answer');
                }
            });

            updateResultsPanel();
        }

        function checkMulti(qId) {
            const q = quizData[currentSection].find(item => item.id === qId);
            if (!q) return;

            const checkboxes = document.getElementsByName(`q_${qId}`);
            const selected = [];

            checkboxes.forEach(cb => {
                if (cb.checked) selected.push(cb.value);
            });

            if (selected.length === 0) {
                alert("Выберите хотя бы один вариант ответа!");
                return;
            }

            const sortedSelected = [...selected].sort();
            const sortedCorrect = [...q.correct].sort();
            const isCorrect = JSON.stringify(sortedSelected) === JSON.stringify(sortedCorrect);

            progress[currentSection][qId] = {
                correct: isCorrect,
                selected: selected
            };
            saveProgress();

            const btn = document.getElementById(`btn_${qId}`);
            if (btn) btn.style.display = 'none';

            checkboxes.forEach(cb => {
                cb.disabled = true;
                const wrapper = document.getElementById(`wrap_${cb.id}`);
                wrapper.classList.add('disabled');

                if (q.correct.includes(cb.value) && selected.includes(cb.value)) {
                    wrapper.classList.add('correct-answer');
                } else if (!q.correct.includes(cb.value) && selected.includes(cb.value)) {
                    wrapper.classList.add('wrong-answer');
                } else if (q.correct.includes(cb.value) && !selected.includes(cb.value)) {
                    wrapper.classList.add('missed-answer');
                }
            });

            updateResultsPanel();
        }

        function saveProgress() {
            localStorage.setItem('chemProgress', JSON.stringify(progress));
        }

        function updateResultsPanel() {
            if (!currentSection || !quizData[currentSection]) {
                document.getElementById('results-container').innerHTML = '';
                return;
            }

            const totalQuestions = quizData[currentSection].length;
            const answeredQuestions = Object.keys(progress[currentSection] || {}).length;

            let correctCount = 0;
            for (const ans of Object.values(progress[currentSection] || {})) {
                if (ans.correct) correctCount++;
            }

            const resultsContainer = document.getElementById('results-container');

            if (answeredQuestions > 0) {
                resultsContainer.innerHTML = `
                    <div class="results-block">
                        <h3>Текущий результат: ${currentSection}</h3>
                        <p>Отвечено: ${answeredQuestions} из ${totalQuestions}</p>
                        <div class="score">Правильных: ${correctCount}</div>
                    </div>
                `;
            } else {
                resultsContainer.innerHTML = '';
            }
        }

        function resetProgress() {
            if (confirm("Вы уверены, что хотите сбросить весь прогресс? Это действие необратимо.")) {
                localStorage.removeItem('chemProgress');
                progress = {};
                if (currentSection) loadSection(currentSection);
                toggleSidebar();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        function enableTopNavMouseDrag() {
            const topNav = document.getElementById('top-nav');
            let isDown = false;
            let startX = 0;
            let scrollLeft = 0;

            topNav.addEventListener('mousedown', (e) => {
                isDown = true;
                topNav.classList.add('dragging');
                startX = e.pageX - topNav.offsetLeft;
                scrollLeft = topNav.scrollLeft;
            });

            topNav.addEventListener('mouseleave', () => {
                isDown = false;
                topNav.classList.remove('dragging');
            });

            topNav.addEventListener('mouseup', () => {
                isDown = false;
                topNav.classList.remove('dragging');
            });

            topNav.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - topNav.offsetLeft;
                const walk = (x - startX) * 1.5;
                topNav.scrollLeft = scrollLeft - walk;
            });
        }

        window.onload = init;
    </script>
